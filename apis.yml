name: Metaview
description: >-
  Metaview is an AI-native, agentic recruiting platform used by more than 5,000
  organizations to source, engage, and hire candidates. Its autonomous agents
  handle candidate sourcing, inbound application review against an Ideal
  Candidate Profile, AI interview notetaking purpose-built for recruiting,
  personalized outreach sequences, customizable recruiting reports, and job-post
  generation. Metaview integrates two-way with 60+ recruiting tools including ATS
  platforms (Ashby, Greenhouse, Lever, Gem, SmartRecruiters, Workday, SAP
  SuccessFactors), video conferencing (Zoom, Google Meet, Microsoft Teams),
  scheduling, and SSO providers. The company is backed by GV and Seedcamp. It
  exposes no public developer API today; this profile captures its identity,
  llms.txt, trust posture (SOC 2, GDPR), and domain security for the API
  Evangelist network.
